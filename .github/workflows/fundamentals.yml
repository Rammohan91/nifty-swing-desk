name: Fetch NSE fundamentals

# Manual only. The daily fundamentals refresh for shortlisted stocks runs inside "Fetch NSE end-of-day
# data". This workflow is for debugging symbols or a one-off full-universe pull.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated symbols to fetch now (debug). Leave empty for the normal run."
        required: false
        default: ""
      max_symbols:
        description: "Cap per run for the normal run"
        required: false
        default: "180"

permissions:
  contents: write

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 curl_cffi==0.7.4
      - name: Fetch
        env:
          MAX_SYMBOLS: ${{ github.event.inputs.max_symbols || '180' }}
        run: python fetch_fundamentals.py ${{ github.event.inputs.symbols }}
      - name: Commit data
        run: |
          git config user.name "nse-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fundamentals
          git diff --cached --quiet || git commit -m "Fundamentals $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
